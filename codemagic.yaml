workflows:
  ios-testflight:
    name: iOS TestFlight (Beta)
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Must match the key name saved in
      # Codemagic > Team settings > Integrations > Developer Portal.
      app_store_connect: codemagic

    environment:
      groups:
        # Holds CERTIFICATE_PRIVATE_KEY, the RSA key the distribution
        # certificate is issued against. Reusing one key across builds means
        # Apple issues one certificate instead of a new one every run.
        - signing
      vars:
        BUNDLE_ID: com.toothly.dentistapp
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate launcher icons
        script: dart run flutter_launcher_icons

      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;

      - name: Set up code signing
        # environment.ios_signing only FETCHES existing profiles and aborts
        # the build during preparation when none is found. --create makes the
        # distribution certificate and App Store profile on first run, so no
        # Mac is needed to generate a CSR by hand.
        script: |
          # -e so a failure here stops the build instead of being masked by the
          # trailing query command, -x to echo each command into the log.
          set -ex
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          # Let Flutter run its project migrations (deployment target, UIScene,
          # SPM) FIRST. `flutter build ipa` rewrites project.pbxproj when it
          # migrates, which silently drops the signing settings written below.
          flutter build ios --release --config-only --no-codesign
          xcode-project use-profiles
          # `security find-identity` exits 0 even when it finds nothing, so
          # assert on the output rather than trusting its status code.
          security find-identity -p codesigning -v
          security find-identity -p codesigning -v | grep -q "Apple Distribution" \
            || { echo "ERROR: no Apple Distribution identity in keychain"; exit 1; }

      - name: Flutter analyze
        script: flutter analyze || true

      - name: Build IPA
        # $BUILD_NUMBER is Codemagic's auto-incrementing per-workflow counter,
        # so every TestFlight upload is unique with no extra setup.
        # Version name comes from pubspec.yaml.
        #
        # `flutter build ipa` insists on finding a *development* certificate
        # before it will archive, and an App Store build only ever has an
        # Apple Distribution one. Build unsigned with Flutter, then archive
        # and export with Codemagic's tooling, which signs using the profiles
        # fetched above.
        script: |
          flutter build ios --release --no-codesign \
            --build-number=$BUILD_NUMBER
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Internal testers get the build immediately. To auto-distribute to an
        # external group, uncomment and name it (requires one-time Beta App Review):
        # beta_groups:
        #   - "External Testers"

      email:
        recipients:
          - kenjieramos22@gmail.com
          - psycheabrencillo18@gmail.com
        notify:
          success: true
          failure: true
